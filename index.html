<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>NIKHILs TECH STUDIO</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ninja.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas><div id="glow" aria-hidden="true"></div>
<div class="shell">
<aside class="side" id="side">
  <div class="side-top">
    <div class="coin" id="coin"><div class="halo"></div><div class="logo" id="logoBox" title="Click to change logo"><img id="logoImg" alt="NIKHILs TECH STUDIO"><span id="logoFb">N</span></div></div>
    <div class="sid"><b>NIKHILs TECH STUDIO</b><span class="tagl">Learn. Practice. Simulate. Grow.</span></div>
    <button class="more" id="sMore" aria-expanded="false" aria-controls="sBody"><span>Show team</span><i class="ph ph-caret-down" aria-hidden="true"></i></button>
  </div>
  <div class="side-body" id="sBody">
    <div class="sep"></div>
    <div class="lbl">Team</div>
    <div class="ppl" id="ppl"></div>
    <div class="sep"></div>
    <button class="srch" id="kBtn" aria-label="Search or run a command"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span>Search or run a command</span><kbd>Ctrl K</kbd></button>
    <div class="qa">
      <button class="fvb" id="fvBtn" aria-pressed="false"><i class="ph ph-eye" aria-hidden="true"></i><span>Founder view</span></button>
      <button class="ib" id="thBtn" aria-label="Switch light or dark theme"><i class="ph ph-moon" id="thIco" aria-hidden="true"></i></button>
      <button class="ib" id="nBtn" aria-label="Notifications"><i class="ph ph-bell" aria-hidden="true"></i><span class="bd" id="bdot"></span></button>
    </div>
    <div class="sep"></div>
    <div class="st"><i class="ph ph-cloud-check" aria-hidden="true"></i><span id="sync">Local mode</span></div>
    <button class="tg ac cn" id="cnBtn" style="display:none">Connect sheet</button><div id="clock" class="clk"></div>
  </div>
</aside>
<div class="mainc">
  <header class="hd" id="hd"><div class="hd2" id="nav"></div></header>
  <main id="view" tabindex="-1"></main>
</div>
</div>
<nav class="bnav" id="bnav" aria-label="Main"></nav>
<div class="sheet" id="sheet"></div>
<div class="ov" id="ov"><div class="pal" role="dialog" aria-label="Command palette"><input id="pin" placeholder="Type a command, for example: show overdue tasks" autocomplete="off" aria-label="Command"><div class="pl" id="pl"></div></div></div>
<div class="ov" id="mov"><div class="mod" id="mod" role="dialog"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="logoIn" accept="image/*" hidden>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/modals.js"></script>
<script src="js/events.js"></script>
<script src="js/logo.js"></script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
<script src="js/ninja-data.js"></script>
<script src="js/sfx.js"></script>
<script src="js/ninja-ui.js"></script>
<script src="js/ninja-3d.js"></script>
<script src="js/ninja-brain.js"></script>
<script src="js/ninja-chat.js"></script>
<script src="js/ninja-llm.js"></script>
<script src="js/ninja-voice.js"></script>
<script src="js/ninja-wire.js"></script>
<script src="js/main.js"></script>
</body>
</html>
