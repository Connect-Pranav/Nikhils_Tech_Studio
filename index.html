<style>
/* Design tokens. One accent (brand blue from the logo). Amber/red/green are status only.
   Shape system: containers 16px, controls 10px, tags and chips are pills.
   Z scale: header 30, mobile nav 40, overlays 50, toast 60. */
:root{
  --bg:#060d13;--s1:#0b1620;--s2:#101e2a;--s3:#17293a;
  --ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.17);
  --tx:#e8eef2;--mu:#93a5b0;
  --ac:#2563eb;--act:#7aa8ff;--ok:#3ecf9e;--warn:#f2b04a;--bad:#ff7a7a;
  --sh:0 24px 60px rgba(2,8,16,.55);--rc:16px;--rk:10px;color-scheme:dark;
}
[data-theme="light"]{
  --bg:#eef2f5;--s1:#ffffff;--s2:#f4f7f9;--s3:#e6ecf1;
  --ln:rgba(10,30,50,.1);--ln2:rgba(10,30,50,.22);
  --tx:#0d1b26;--mu:#475b68;
  --ac:#1d4ed8;--act:#1d4ed8;--ok:#0b7a54;--warn:#8f5200;--bad:#b42323;
  --sh:0 24px 60px rgba(30,60,90,.18);color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;color:var(--tx);background:linear-gradient(180deg,var(--s2),var(--bg) 420px) no-repeat,var(--bg);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}
i.ph{font-size:1.15em;line-height:1;flex:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}

/* header */
.hd{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ln)}
@supports (backdrop-filter:blur(1px)){.hd{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px)}}
.hd1{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd2{display:flex;align-items:center;gap:18px;height:56px;overflow-x:auto;scrollbar-width:none}
.hd2::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;flex:none;position:relative}
.logo img{width:100%;height:100%;object-fit:cover;display:none}
.logo.has{background:#000;box-shadow:0 0 0 1px var(--ln2)}
.bn{line-height:1.15;min-width:0}.bn b{display:block;font-size:14px;font-weight:700;letter-spacing:.06em;white-space:nowrap}.bn span{font-size:12px;color:var(--mu)}
.hr{display:flex;align-items:center;gap:10px}
.srch{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:1px solid var(--ln2);border-radius:var(--rk);background:var(--s1);color:var(--mu);font-size:14px;min-width:260px;transition:.2s}
.srch:hover{border-color:var(--act);color:var(--tx)}
.srch span{flex:1;text-align:left;white-space:nowrap}
kbd{font:500 11px 'Geist Mono',monospace;border:1px solid var(--ln2);border-radius:6px;padding:2px 6px;color:var(--mu)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;position:relative;transition:.2s;background:var(--s1)}
.ib:hover{border-color:var(--act)}
.ib .bd{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
.fvb{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--ln2);font-size:14px;font-weight:500;white-space:nowrap;background:var(--s1);transition:.2s}
.fvb:hover{border-color:var(--act)}.fvb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pf{display:flex;align-items:center;gap:12px;padding-left:14px;border-left:1px solid var(--ln)}
.pf div:first-child{text-align:right;line-height:1.2}.pf b{display:block;font-size:14px}.pf span{font-size:12px;color:var(--mu)}
.av{width:42px;height:42px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;border:1px solid var(--ln2)}
.seg1{display:flex;gap:4px;padding:4px;border:1px solid var(--ln);border-radius:999px;background:var(--s1);flex:none}
.gb{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mu);transition:.2s;white-space:nowrap}
.gb:hover{color:var(--tx)}.gb.on{background:var(--ac);color:#fff}
.seg2{display:flex;gap:2px;padding-left:18px;border-left:1px solid var(--ln);flex:none}
.sb{padding:9px 14px;border-radius:var(--rk);font-size:14px;font-weight:500;color:var(--mu);transition:.2s;white-space:nowrap}
.sb:hover{color:var(--tx)}.sb.on{background:var(--s3);color:var(--tx)}

/* type and surfaces */
main{padding-bottom:40px;min-height:70dvh}
.hero{display:block;padding:8px 0 28px}
.hero h1{font-size:clamp(34px,4.4vw,62px);line-height:1.02;letter-spacing:-.04em;font-weight:600}
.hero h1 span{display:block;color:var(--mu);font-weight:500}
.hero .hl{justify-self:end}
.hero .hl img{display:block;width:clamp(130px,15vw,210px);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--ln2),0 30px 80px rgba(37,99,235,.28)}
.ph1{padding:44px 0 26px}
.ph1 h2{font-size:clamp(32px,4.4vw,56px);letter-spacing:-.035em;line-height:1.04;font-weight:600}
.ph1 p{color:var(--mu);margin-top:12px;max-width:60ch;font-size:16px}
.note{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rc);padding:24px;position:relative}
.card.tint{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 22%,var(--s1)),var(--s1) 70%)}
.lbl{font-size:13px;font-weight:500;color:var(--mu)}
.h3{font-size:20px;font-weight:600;letter-spacing:-.02em}
.num{font-family:'Geist Mono',monospace;font-size:clamp(40px,4vw,60px);font-weight:500;letter-spacing:-.05em;line-height:1;margin:14px 0 8px}
.num small{font-size:.38em;color:var(--mu);letter-spacing:0;font-weight:400}
.mu{color:var(--mu);font-size:14px}.sm{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt40{margin-top:40px}
.tg{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c,var(--mu));background:var(--s3)}
@supports (background:color-mix(in srgb,red 10%,blue)){.tg{background:color-mix(in srgb,var(--c,var(--mu)) 15%,transparent)}}
.ok{--c:var(--ok)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}.ac{--c:var(--act)}.mt{--c:var(--mu)}
button.tg,a.tg{cursor:pointer;text-decoration:none}
button.tg:hover,a.tg:hover{filter:brightness(1.2)}
.bar{height:4px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:var(--act);border-radius:99px}
.ring{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--act) var(--p,0%),var(--s3) 0);display:grid;place-items:center;position:relative;flex:none}
.ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--s1)}
.ring b{position:relative;z-index:1;font:500 28px 'Geist Mono',monospace;letter-spacing:-.04em}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}
.two{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:24px;align-items:start}
.stick{position:sticky;top:140px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* forms: labels above, hints never replace labels */
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld label{font-size:13px;font-weight:500;color:var(--mu)}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;background:var(--s2);border:1px solid var(--ln2);border-radius:var(--rk);color:var(--tx);font:inherit;font-size:15px;padding:12px 14px;outline:0;transition:border-color .2s}
.fld textarea{resize:vertical;min-height:140px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--act)}
.fld input::placeholder,.fld textarea::placeholder{color:var(--mu);opacity:.75}
.fld select option{background:var(--s2);color:var(--tx)}
.fld input[type=range]{min-height:0;padding:0;accent-color:var(--ac)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.stack{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--rk);background:var(--ac);color:#fff;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px) scale(.98)}
.btn.g{background:var(--s3);color:var(--tx)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.wc{font-size:12px;color:var(--mu);text-align:right;margin-top:-4px}.wc.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tb{padding:9px 16px;border-radius:999px;border:1px solid var(--ln2);font-size:13px;font-weight:500;color:var(--mu);transition:.2s}
.tb:hover{color:var(--tx)}.tb.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.segb{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.segb button{padding:8px 14px;border-radius:999px;border:1px solid var(--ln2);font-size:12px;font-weight:600;color:var(--mu);transition:.2s}
.segb button:hover{color:var(--tx)}
.segb button.on{border-color:var(--c);color:var(--c);background:var(--s3)}

/* lists */
.list>.ri{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-top:1px solid var(--ln)}
.list>.ri:first-child{border-top:0;padding-top:4px}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--ln2);flex:none;display:grid;place-items:center;margin-top:1px;transition:.2s}
.ck:hover{border-color:var(--act)}
.ck.d{background:var(--ok);border-color:var(--ok)}
.ck.d:after{content:"";width:5px;height:10px;border:solid #04120c;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tkm{flex:1;min-width:0}.tkt{font-weight:600;font-size:16px;letter-spacing:-.01em}
.ri.dn .tkt{color:var(--mu);text-decoration:line-through}
.dsc{color:var(--mu);font-size:14px;margin-top:8px;line-height:1.55;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.dsc.op{display:block}
.due{font-size:13px;color:var(--mu);white-space:nowrap;margin-top:2px}.due.bad{color:var(--bad)}
.empty{padding:28px 0;color:var(--mu);font-size:14px}

/* media and boards */
.tile{padding:14px}
.tile .th{aspect-ratio:16/10;border-radius:12px;background:var(--s3);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--mu);font-size:34px}
.tile .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile h5{font-size:15px;font-weight:600;margin:12px 0 4px;word-break:break-word}
.drop{display:block;border:1.5px dashed var(--ln2);border-radius:var(--rc);padding:40px 20px;text-align:center;cursor:pointer;transition:.2s;background:var(--s2)}
.drop:hover,.drop.hot{border-color:var(--act);background:var(--s3)}
.drop.off{opacity:.55;cursor:not-allowed}
.drop b{display:block;font-size:18px;letter-spacing:-.02em;margin:8px 0 4px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x proximity}
.col{flex:0 0 280px;background:var(--s2);border:1px solid var(--ln);border-radius:var(--rc);padding:14px;scroll-snap-align:start}
.col h4{font-size:13px;font-weight:600;color:var(--mu);display:flex;justify-content:space-between;padding:2px 4px 6px}
.bc{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-top:10px}
.bc b{display:block;font-size:15px;margin-bottom:4px;word-break:break-word}
.bc select{width:100%;margin-top:12px;background:var(--s2);border:1px solid var(--ln2);border-radius:8px;color:var(--tx);font:inherit;font-size:13px;padding:8px 10px}
.cols{display:flex;align-items:flex-end;gap:10px;height:160px;margin-top:20px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
.cols i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--act);min-height:3px;height:0}
.cols span{font-size:12px;color:var(--mu)}
.three{display:grid;grid-template-columns:repeat(3,1fr)}
.three>div{padding:8px 28px}.three>div+div{border-left:1px solid var(--ln)}.three>div:first-child{padding-left:0}
.kv{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}.kv small{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}.kv b{font:500 18px 'Geist Mono',monospace}
canvas.wv{width:100%;height:64px;display:block;border-radius:10px;background:var(--s2)}
.status{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0 28px;border-top:1px solid var(--ln);color:var(--mu);font-size:13px}
.status .st{display:flex;align-items:center;gap:8px}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(2,8,14,.66);display:none;align-items:flex-start;justify-content:center;padding:9vh 20px 20px;z-index:50}
.ov.on{display:flex}
.pal,.mod{width:100%;max-width:640px;background:var(--s1);border:1px solid var(--ln2);border-radius:var(--rc);overflow:hidden;box-shadow:var(--sh)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ln);outline:0;color:var(--tx);font:inherit;font-size:17px;padding:20px 24px}
.pl{max-height:340px;overflow:auto;padding:8px}
.pi{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-radius:10px;font-size:15px}
.pi.sel,.pi:hover{background:var(--s3)}.pi small{color:var(--mu);font-size:12px}
.mod{padding:28px;max-height:84dvh;overflow:auto}
.mod h3{font-size:24px;letter-spacing:-.03em;margin-bottom:20px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;z-index:60;white-space:nowrap}
.bnav,.sheet{display:none}
@media (prefers-reduced-motion:no-preference){
  .ov.on .pal,.ov.on .mod{animation:pop .25s cubic-bezier(.16,1,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
}
@media (max-width:1180px){.pf div:first-child{display:none}.srch{min-width:0}.srch kbd{display:none}}
@media (max-width:1000px){.c4,.c5,.c7,.c8,.c6{grid-column:span 12}.two{grid-template-columns:1fr}.stick{position:static}.three{grid-template-columns:1fr}.three>div+div{border-left:0;border-top:1px solid var(--ln);margin-top:20px;padding-top:20px}.three>div{padding:8px 0}}
@media (max-width:820px){
  .hd2{display:none}.hd1{height:60px}.srch span,.fvb span,.bn span{display:none}.srch{width:42px;padding:0;justify-content:center;min-width:0}.srch kbd{display:none}
  .pf{display:none}.hero{grid-template-columns:1fr;padding-top:28px}.hero .hl{display:none}
  .ri{flex-wrap:wrap}.due{margin-left:38px}
  body{padding-bottom:80px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--ln2);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--mu);padding:8px 0;min-height:52px}
  .bnav button i{font-size:22px}.bnav button.on{color:var(--act)}
  .sheet.on{display:block;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--s1);border-radius:20px 20px 0 0;border-top:1px solid var(--ln2);padding:18px 20px 96px;max-height:80dvh;overflow:auto}
  .sheet button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;font-size:16px;font-weight:500;border-bottom:1px solid var(--ln)}
  .bento.m{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px}
  .bento.m>.card{flex:0 0 84%;scroll-snap-align:start}
  .toast{bottom:96px}
}

/* ---------- v6: sidebar shell, depth, interaction ---------- */
body{background:var(--bg)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transition:opacity .4s;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 22%,transparent),transparent 65%)}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:318px minmax(0,1fr);gap:24px;max-width:1560px;margin:0 auto;padding:24px clamp(16px,2.4vw,32px) 24px;align-items:start}
.side{position:sticky;top:24px;max-height:calc(100dvh - 48px);overflow:auto;scrollbar-width:none;background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:28px 22px;perspective:900px}
.side::-webkit-scrollbar{display:none}
.side-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.coin{position:relative;width:148px;height:148px;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
.coin .halo{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--ac),transparent 30%,var(--act) 55%,transparent 80%,var(--ac));filter:blur(10px);opacity:.75;transform:translateZ(-20px)}
.coin .logo{width:148px;height:148px;position:relative;transform:translateZ(30px);box-shadow:0 18px 40px -10px color-mix(in srgb,var(--ac) 60%,transparent),0 0 0 1px var(--ln2)}
.sid b{display:block;font-size:17px;letter-spacing:.06em;font-weight:700}
.tagl{display:block;font-size:13px;color:var(--mu);margin-top:4px}
.more{display:none;align-items:center;gap:6px;font-size:13px;color:var(--act);padding:8px 14px;border:1px solid var(--ln2);border-radius:var(--rk)}
.more i{transition:transform .25s}.more[aria-expanded="true"] i{transform:rotate(180deg)}
.sep{height:1px;background:var(--ln);margin:20px 0}
.side-body .lbl{margin-bottom:12px}
.ppl{display:grid;gap:8px}
.pp{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;border:1px solid transparent;text-align:left;width:100%;transition:.2s;transform-style:preserve-3d}
.pp:hover{background:var(--s2);border-color:var(--ln2);transform:translateX(4px)}
.pp .av{width:44px;height:44px;flex:none}
.pp b{display:block;font-size:14px}.pp span{display:block;font-size:12px;color:var(--mu);line-height:1.3}
.pp .ct{margin-left:auto;text-align:right;font-family:'Geist Mono',monospace;font-size:13px;color:var(--act)}
.pp .ct small{display:block;font-size:10px;color:var(--mu);font-family:'Geist',sans-serif}
.side .srch{width:100%;min-width:0}
.qa{display:flex;gap:8px;margin-top:12px}.qa .fvb{flex:1;justify-content:center;padding:0 10px}
.side .st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.clk{font-size:12px;color:var(--mu);margin-top:6px}
.mainc{min-width:0}
.mainc .wrap{max-width:none;padding:0}
.hd{position:sticky;top:16px;z-index:30;background:transparent;border:0;margin-bottom:24px;display:flex;justify-content:flex-end}
@supports (backdrop-filter:blur(1px)){.hd{background:transparent;backdrop-filter:none}}
.hd2{height:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px;overflow:visible}
.hd2 .seg1{background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(14px);border-radius:18px;padding:6px;box-shadow:0 12px 30px -16px rgba(0,0,0,.6)}
.hd2 .gb{border-radius:14px}
.hd2 .seg2{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--ln)}
#view{padding-bottom:150px;perspective:1200px}
.card{transform-style:preserve-3d;transition:transform .18s ease-out,border-color .2s,box-shadow .25s;will-change:transform;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--act) 16%,transparent),transparent 60%)}
.card:hover::before{opacity:1}
.card:hover{border-color:color-mix(in srgb,var(--act) 40%,var(--ln2));box-shadow:0 24px 50px -28px color-mix(in srgb,var(--ac) 70%,transparent)}
.card.flat{transform:none!important}
button,.tg{transition:transform .15s,background .2s,border-color .2s,color .2s}
.coin.spin .logo{animation:flip .9s cubic-bezier(.3,.7,.2,1)}
@keyframes flip{from{transform:translateZ(30px) rotateY(0)}to{transform:translateZ(30px) rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.coin,.card{transition:none}.coin.spin .logo{animation:none}}
@media (hover:none){#glow{display:none}}
@media (max-width:1100px){.shell{grid-template-columns:260px minmax(0,1fr);gap:18px}.coin,.coin .logo{width:112px;height:112px}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;padding:12px 16px 0;gap:14px}
  .side{position:static;max-height:none;padding:16px;border-radius:20px}
  .side-top{flex-direction:row;text-align:left;gap:14px}
  .coin,.coin .logo{width:60px;height:60px}.coin .halo{inset:-3px;filter:blur(6px)}
  .sid b{font-size:14px}.tagl{font-size:12px}
  .more{display:flex;margin-left:auto;flex:none}.more span{display:none}
  .side-body{display:none}.side.open .side-body{display:block}
  .hd{display:none}
  .mainc .bento.m{margin:0}
}
.pp>.av{display:grid;place-items:center;background:var(--s3)}
@media (max-width:820px){.more span{display:inline}.frow{grid-template-columns:1fr!important}}
@media (max-width:820px){.side .srch,.side .fvb{width:auto}.side .srch{width:100%;padding:0 14px;justify-content:flex-start}.side .srch span,.side .fvb span{display:inline}.side .srch kbd{display:inline}}

/* ---------- AI Ninja (3D) ---------- */
#nj{position:fixed;right:24px;bottom:20px;z-index:45;pointer-events:none}
.nj-stage{position:relative;width:150px;height:186px;pointer-events:none;cursor:pointer;border-radius:24px;outline:none;transition:transform .3s}
.nj-stage:focus-visible{box-shadow:0 0 0 2px var(--act)}
.nj-hit{position:absolute;left:22%;width:56%;top:10%;bottom:2%;pointer-events:auto;border-radius:20px}
.nj-stage canvas{width:100%;height:100%;display:block;pointer-events:none}
.nj-tip{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;background:var(--s2);border:1px solid var(--ln2);color:var(--tx);font-size:12px;padding:7px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.nj-stage:hover .nj-tip,.nj-stage:focus-visible .nj-tip{opacity:1}
#nj.open .nj-tip{display:none}
.nj-flat{display:none;align-items:center;gap:10px;pointer-events:auto;height:48px;padding:0 18px 0 8px;border-radius:999px;background:var(--s2);border:1px solid var(--ln2);font-weight:600}
.nj-flat img{width:34px;height:34px;border-radius:50%}
#nj.noWebgl .nj-stage{display:none}#nj.noWebgl .nj-flat{display:flex}
.nj-panel{position:absolute;right:166px;bottom:0;width:384px;height:min(560px,calc(100dvh - 40px));display:flex;flex-direction:column;pointer-events:auto;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(18px);border:1px solid color-mix(in srgb,var(--act) 35%,var(--ln2));border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 60px -30px var(--ac);transform:translateY(16px) scale(.97);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility .25s;overflow:hidden}
#nj.open .nj-panel{transform:none;opacity:1;visibility:visible}
.nj-h{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--ln)}
.nj-h img{width:36px;height:36px;border-radius:50%;flex:none}
.nj-h b{display:block;font-size:12px;letter-spacing:.05em;white-space:nowrap}.nj-h span.sub{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;color:var(--mu);margin-top:2px}
.nj-h .on{width:7px;height:7px;border-radius:50%;background:var(--ok)}.nj-h .off{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.nj-h .sp{flex:1}
.nj-ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mu);border:1px solid transparent}
.nj-ib:hover{color:var(--tx);border-color:var(--ln2);background:var(--s2)}.nj-ib.on{color:var(--act)}
.nj-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.nj-m{max-width:88%;display:flex;flex-direction:column;gap:4px}
.nj-m.u{align-self:flex-end;align-items:flex-end}
.nj-b{overflow-wrap:anywhere;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.nj-m.a .nj-b{background:var(--s2);border:1px solid var(--ln);border-top-left-radius:6px}
.nj-m.u .nj-b{background:var(--ac);color:#fff;border-top-right-radius:6px}
.nj-m.e .nj-b{border-color:color-mix(in srgb,var(--bad) 50%,var(--ln))}
.nj-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mu)}
.nj-meta button{color:var(--mu);font-size:14px;line-height:1}.nj-meta button:hover{color:var(--act)}
.nj-dots{display:flex;gap:5px;align-items:center}.nj-dots i{width:6px;height:6px;border-radius:50%;background:var(--act);animation:njd 1.1s infinite}
.nj-dots i:nth-child(2){animation-delay:.15s}.nj-dots i:nth-child(3){animation-delay:.3s}
@keyframes njd{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.nj-sug{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.nj-sug button{font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--ln2);color:var(--tx);background:var(--s1);text-align:left}
.nj-sug button:hover{border-color:var(--act);background:var(--s2)}
.nj-f{display:flex;align-items:flex-end;gap:8px;padding:12px;border-top:1px solid var(--ln)}
.nj-f textarea{flex:1;resize:none;max-height:110px;min-height:42px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln2);background:var(--s1);color:var(--tx);font:inherit;font-size:14px;line-height:1.4}
.nj-f textarea:focus{outline:none;border-color:var(--act)}
.nj-f .nj-ib{width:42px;height:42px;border:1px solid var(--ln2);background:var(--s1);flex:none}
.nj-f .nj-ib.go{background:var(--ac);border-color:var(--ac);color:#fff}
.nj-f .nj-ib.rec{background:var(--bad);border-color:var(--bad);color:#fff}
@media (max-width:1000px){.nj-stage{width:132px;height:164px}.nj-panel{right:146px;width:340px}}
@media (max-width:820px){
  #nj{right:10px;bottom:76px}
  .nj-stage{width:104px;height:132px}
  .nj-panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:min(72dvh,600px);border-radius:22px 22px 0 0;z-index:48;padding-bottom:env(safe-area-inset-bottom)}
  #nj{--ph:min(72dvh,600px)}#nj.open .nj-stage{transform-origin:100% 100%;transform:translateY(calc(-1 * (var(--ph) - 76px))) scale(.72)}
  .nj-tip{display:none}
}
@media (prefers-reduced-motion:reduce){.nj-panel,.nj-stage{transition:none}.nj-dots i{animation:none}}

.ig-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ig-av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--ln2);background:var(--s3);flex:none}
.ig-st{display:flex;gap:28px;flex-wrap:wrap}.ig-st div b{display:block;font-size:26px;font-family:'Geist Mono',monospace;letter-spacing:-.02em}.ig-st div span{font-size:12px;color:var(--mu)}
.ig-post{padding:0;overflow:hidden}.ig-post .im{aspect-ratio:1;background:var(--s3);display:block;width:100%;object-fit:cover}
.ig-post .bd2{padding:14px 16px 16px}.ig-post p{font-size:13px;color:var(--mu);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 10px;min-height:39px}
.ig-m{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--mu)}.ig-m span{display:flex;gap:5px;align-items:center}.ig-m a{margin-left:auto}
.steps{display:grid;gap:10px;counter-reset:s;margin:14px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:14px;line-height:1.55;color:var(--mu)}
.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--s3);color:var(--tx);display:grid;place-items:center;font-size:12px;font-weight:600}
.steps b{color:var(--tx);font-weight:600}.steps code{font-family:'Geist Mono',monospace;font-size:12px;background:var(--s3);padding:1px 6px;border-radius:6px;color:var(--tx)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.cn{margin-top:10px;display:flex}
.ra{display:inline-flex;gap:2px;margin-left:6px;flex:none;opacity:.55;transition:opacity .2s}
.ra button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mu);font-size:16px}
.ra button:hover{color:var(--tx);background:var(--s3)}.ra button[data-del]:hover{color:var(--bad)}
.ri:hover .ra,.card:hover .ra,.bc:hover .ra,.ra:focus-within{opacity:1}
.bc{position:relative}.bc .ra{position:absolute;top:6px;right:6px}
.cnres{font-size:13px;line-height:1.5;margin-top:4px}.cnres.ok{color:var(--ok)}.cnres.bad{color:var(--bad)}
/* icons: inline masks, no external font needed */
.ph{display:inline-block;width:1em;height:1em;vertical-align:-.125em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none;font-style:normal}

<script>
(function(){
var RM=false;try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(err){}

/* ---------- config and data layer ---------- */

var SHEETS_ON=false; /* Google Sheet sync is paused: everything is stored on this device. Set true and paste the URL below to switch it back on. */

var CFG={SCRIPT_URL:SHEETS_ON?GOOGLE_SHEETS_API:''};try{var _sv=localStorage.getItem('nts_script');if(SHEETS_ON&&!CFG.SCRIPT_URL&&_sv)CFG.SCRIPT_URL=_sv;if(!SHEETS_ON){localStorage.removeItem('nts_script');localStorage.removeItem('nts_q')}}catch(err){} /* paste your Google Apps Script web app URL between the quotes */
var PEOPLE=['Nikhil','Monish','Pranav'];
var ROLES={Nikhil:['Founder and Strategic Head','Strategy'],Monish:['Creative Head','Creative'],Pranav:['Operations and Marketing Lead','Operations and growth']};
var TARGET={n:100,label:'30 Nov 2026',date:new Date(2026,10,30)};
var IDB=null;
function idbOpen(cb){if(IDB)return cb(IDB);try{var r=indexedDB.open('nts',1);r.onupgradeneeded=function(){r.result.createObjectStore('f')};r.onsuccess=function(){IDB=r.result;cb(IDB)};r.onerror=function(){cb(null)}}catch(err){cb(null)}}
function idbPut(k,v,cb){idbOpen(function(db){if(!db){cb&&cb(false);return}try{var tx=db.transaction('f','readwrite');tx.objectStore('f').put(v,k);tx.oncomplete=function(){cb&&cb(true)};tx.onerror=function(){cb&&cb(false)}}catch(err){cb&&cb(false)}})}
function idbGet(k,cb){idbOpen(function(db){if(!db){cb(null);return}try{var q=db.transaction('f','readonly').objectStore('f').get(k);q.onsuccess=function(){cb(q.result||null)};q.onerror=function(){cb(null)}}catch(err){cb(null)}})}
var blobUrls={};
function isLocal(u){return (u.detail||'').indexOf('local:')===0}
var MIMES={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',avif:'image/avif',mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',ogg:'audio/ogg',pdf:'application/pdf',txt:'text/plain',md:'text/plain',csv:'text/csv',json:'application/json'};
function mimeFor(n){var m=String(n||'').toLowerCase().match(/\.([a-z0-9]+)$/);return (m&&MIMES[m[1]])||'application/octet-stream'}
function idbBlob(k,name,cb){idbGet(k,function(v){if(!v){cb(null);return}var b=null;try{if(typeof Blob!=='undefined'&&v instanceof Blob){b=v.type?v:new Blob([v],{type:mimeFor(name)})}else if(v&&v.buf){b=new Blob([v.buf],{type:v.type||mimeFor(v.name||name)})}}catch(err){b=null}cb(b)})}
function blobUrl(k,b){return blobUrls[k]||(blobUrls[k]=URL.createObjectURL(b))}
function fileName(it){var n=it.to;if(n&&/\.[A-Za-z0-9]{1,6}$/.test(n))return n;var m=(it.notes||'').match(/File: (.+)$/);if(m)return m[1];return it.title||'file'}
function openFile(k,it,dl){
  var name=fileName(it);
  idbBlob(k,name,function(b){
    if(!b||!b.size){toast('This file could not be read from browser storage. Please upload it again.');return}
    var u=blobUrl(k,b),t=b.type||mimeFor(name),kind=t.split('/')[0],body;
    if(dl){var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);toast('Downloading '+name);return}
    if(kind==='image')body='<img src="'+u+'" alt="'+esc(it.title)+'">';

    else if(t==='application/pdf')body='<iframe src="'+u+'" title="'+esc(it.title)+'"></iframe>';

    $('mod').style.maxWidth='min(920px,94vw)';

  });
}

/* ===== Google Sheets service: every backend call goes through here ===== */
var GoogleSheets=(function(){
  function base(){return CFG.SCRIPT_URL}
  function fail(msg,server){var e=new Error(msg);e.server=!!server;return e}
  function call(action,body){
    var o={action:action},k;for(k in body){o[k]=body[k]}
    return fetch(base(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)})
      .then(function(r){return r.json()})
      .then(function(d){if(!d||d.ok===false)throw fail((d&&d.error)||'The sheet rejected the request',true);return d})
  }
  function getAll(){
    return fetch(base()).then(function(r){return r.json()}).then(function(d){
      if(!(d instanceof Array))throw fail((d&&d.error)||'Unexpected reply from the web app',true);return d})
  }
  function ofType(list,type){if(!type)return list;var r=[],i;for(i=0;i<list.length;i++){if(list[i].type===type)r.push(list[i])}return r}
  return {
    configured:function(){return !!base()},
    getRecords:function(type){return getAll().then(function(l){return ofType(l,type)})},
    createRecord:function(item){return call('add',{item:item})},
    updateRecord:function(id,fields){var it={id:id},k;for(k in fields){it[k]=fields[k]}return call('update',{item:it})},
    deleteRecord:function(id){return call('delete',{item:{id:id}})},
    searchRecords:function(q,type){q=String(q||'').toLowerCase();return getAll().then(function(l){l=ofType(l,type);if(!q)return l;var r=[],i,j,f=['title','detail','from','to','notes','status'];
      for(i=0;i<l.length;i++){for(j=0;j<f.length;j++){if(String(l[i][f[j]]||'').toLowerCase().indexOf(q)>-1){r.push(l[i]);break}}}return r})},
    ping:function(){return getAll().then(function(l){return l.length})}
  };
})();
/* write queue: failed writes are kept and retried, nothing is lost while offline */
var queue=[];try{queue=JSON.parse(localStorage.getItem('nts_q')||'[]')}catch(err){queue=[]}
var sync={s:'idle',m:'',warned:false},flushing=false;
function saveQ(){try{localStorage.setItem('nts_q',JSON.stringify(queue))}catch(err){}}
function syncText(){
  if(!CFG.SCRIPT_URL)return 'Saved on this device';
  if(sync.s==='saving')return 'Saving to Google sheet...';
  if(sync.s==='error')return 'Not synced: '+sync.m+(queue.length?' ('+queue.length+' waiting)':'');

function setSync(st,m){sync.s=st;sync.m=m||'';var e=document.getElementById('sync');if(e)e.textContent=syncText()}

function send(a,item){lastWrite=Date.now();if(!CFG.SCRIPT_URL)return;queue.push({a:a,item:item,n:0});saveQ();flush()}
function flush(){
  if(flushing||!queue.length||!CFG.SCRIPT_URL)return;flushing=true;setSync('saving');
  var op=queue[0],p=op.a==='add'?GoogleSheets.createRecord(op.item):op.a==='delete'?GoogleSheets.deleteRecord(op.item.id):GoogleSheets.updateRecord(op.item.id,op.item);
  p.then(function(){queue.shift();saveQ();flushing=false;sync.warned=false;if(queue.length)flush();else setSync('ok')})
   .catch(function(err){flushing=false;op.n=(op.n||0)+1;
     if(err&&err.server&&op.n>=3){queue.shift();saveQ();toast('The sheet rejected a change: '+err.message)}
     setSync('error',errMsg(err));if(!sync.warned){sync.warned=true;toast('Could not save to the sheet. Your change is kept and will retry.')}});
}

function cache(){try{localStorage.setItem('nts_items',JSON.stringify(items))}catch(err){}}
function uid(){return 'N'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function dueFor(k){var d=new Date();if(k==='tomorrow')d.setDate(d.getDate()+1);else if(k==='week')d.setDate(d.getDate()+6);return iso(d)}
function post(action,item){send(action,item)}
function addItem(o){var now=new Date().toISOString();var it={id:uid(),type:o.type,title:o.title,detail:o.detail||'',from:o.from||'',to:o.to||'',priority:o.priority||'Normal',status:o.status||'',due:o.due||'',created:now,updated:now,notes:o.notes||''};items.unshift(it);cache();send('add',it);state.fresh=it.id;return it}
function setStatus(id,st){var i;for(i=0;i<items.length;i++){if(items[i].id===id){items[i].status=st;items[i].updated=new Date().toISOString();cache();send('update',items[i]);return}}}
function editItem(id,f){var it=getItem(id),k;if(!it)return;for(k in f){it[k]=f[k]}it.updated=new Date().toISOString();cache();send('update',it)}
function deleteItem(id){var i;for(i=0;i<items.length;i++){if(items[i].id===id){items.splice(i,1);break}}cache();send('delete',{id:id})}
function getItem(id){var i;for(i=0;i<items.length;i++){if(items[i].id===id)return items[i]}return null}
function loadItems(cb){
  if(!CFG.SCRIPT_URL||Date.now()-lastWrite<8000)return;
  if(queue.length){flush();return}
  GoogleSheets.getRecords().then(function(d){
    var lc=[],q;for(q=0;q<items.length;q++){if(isLocal(items[q]))lc.push(items[q])}d=d.concat(lc);
    d.sort(function(a,b){return a.created<b.created?1:-1});
    if(JSON.stringify(d)!==JSON.stringify(items)){items=d;cache();cb()}
    if(sync.s!=='saving')setSync('ok');
  }).catch(function(err){setSync('error',errMsg(err))});
}
function byType(t){var r=[],i;for(i=0;i<items.length;i++){if(items[i].type===t)r.push(items[i])}return r}
function T(){return byType('task')}
function R(){return byType('request')}
function isOverdue(t){return t.status!=='COMPLETED'&&t.due&&t.due<iso(new Date())}
function cnt(list,fn){var n=0,i;for(i=0;i<list.length;i++){if(fn(list[i]))n++}return n}
function pendCount(){return cnt(T(),function(t){return t.status!=='COMPLETED'})}
function openCount(){return cnt(R(),function(t){return t.status!=='COMPLETED'})}
function publishedCount(){return cnt(byType('content'),function(c){return c.status==='PUBLISHED'})}
function daysLeft(){return Math.max(0,Math.ceil((TARGET.date.getTime()-Date.now())/864e5))}
function wc(s){var t=String(s).trim();return t?t.split(/\s+/).length:0}
function dueLabel(d){if(!d)return 'No date';var t=iso(new Date());if(d===t)return 'Due today';if(d<t)return 'Overdue, '+d;return 'Due '+d}
function fmt(s){var d=new Date(s);return isNaN(d.getTime())?'':d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function stCls(s){
  if(s==='COMPLETED'||s==='ACTIVE'||s==='UPLOADED'||s==='WON'||s==='PUBLISHED'||s==='READY')return 'ok';
  if(s==='PENDING'||s==='HOLD'||s==='TESTING'||s==='FOLLOW-UP')return 'warn';
  if(s==='LOST')return 'bad';
  if(s==='ARCHIVED')return 'mt';
  return 'ac';
}

/* ---------- motion (GSAP, only where it carries meaning) ---------- */
function countUp(el){
  var to=parseFloat(el.getAttribute('data-count'))||0,pre=el.getAttribute('data-pre')||'',suf=el.getAttribute('data-suf')||'';
  if(!G||RM||to===0){el.textContent=pre+to+suf;return}
  var o={v:0};G.to(o,{v:to,duration:.9,ease:'power3.out',onUpdate:function(){el.textContent=pre+Math.round(o.v)+suf}});
}
function playIn(root,intro){
  var nums=root.querySelectorAll('[data-count]'),bars=root.querySelectorAll('[data-w]'),rings=root.querySelectorAll('[data-pct]'),hs=root.querySelectorAll('[data-h]'),i;
  for(i=0;i<nums.length;i++){if(intro)countUp(nums[i]);else nums[i].textContent=(nums[i].getAttribute('data-pre')||'')+nums[i].getAttribute('data-count')+(nums[i].getAttribute('data-suf')||'')}
  function setAll(){
    for(i=0;i<bars.length;i++){bars[i].style.width=bars[i].getAttribute('data-w')+'%'}
    for(i=0;i<hs.length;i++){hs[i].style.height=hs[i].getAttribute('data-h')+'%'}
    for(i=0;i<rings.length;i++){rings[i].style.setProperty('--p',rings[i].getAttribute('data-pct')+'%')}
  }
  if(!G||RM||!intro){setAll();return}
  var j;
  for(j=0;j<bars.length;j++){G.fromTo(bars[j],{width:'0%'},{width:bars[j].getAttribute('data-w')+'%',duration:1,ease:'power3.out',delay:.15})}
  for(j=0;j<hs.length;j++){G.fromTo(hs[j],{height:'0%'},{height:hs[j].getAttribute('data-h')+'%',duration:.9,ease:'power3.out',delay:.15})}
  for(j=0;j<rings.length;j++){G.fromTo(rings[j],{'--p':'0%'},{'--p':rings[j].getAttribute("data-pct")+'%',duration:1,ease:'power3.out',delay:.1})}
  var els=root.querySelectorAll('[data-a]');
  if(els.length)G.fromTo(els,{y:14,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out',stagger:.05,clearProps:'transform,opacity'});
}
function toast(m){
  var t=$('toast');t.textContent=m;
  if(!G||RM){t.style.opacity=1;setTimeout(function(){t.style.opacity=0},2200);return}
  G.killTweensOf(t);G.fromTo(t,{opacity:0,y:12},{opacity:1,y:0,duration:.3,ease:'power3.out'});
  G.to(t,{opacity:0,y:8,duration:.3,delay:2.1,ease:'power2.in'});
}

  o=o||{};

        addItem({type:type,title:note||f.name,detail:'local:'+key,from:by,to:(mdl0?(o.tag||'Other'):f.name),priority:(mdl0?((o.ver||'v1')+' · '):(kindOf(f)+' · '))+sizeLabel(f.size),status:(mdl0?'TESTING':'UPLOADED'),due:iso(new Date()),notes:(mdl0?((o.notes?o.notes+'. ':'')+'File: '+f.name):'')});

      var it={id:uid(),type:type,title:note||f.name,detail:'',from:by,to:(mdl?(o.tag||'Other'):f.name),priority:(mdl?((o.ver||'v1')+' · '):(kindOf(f)+' · '))+sizeLabel(f.size),status:(mdl?'TESTING':'UPLOADED'),due:iso(new Date()),notes:(mdl?((o.notes?o.notes+'. ':'')+'File: '+f.name):''),created:now,updated:now};

    };
    rd.readAsDataURL(f);
  }

}

var sel=0,shown=[];
function paint(q){
  q=(q||'').toLowerCase();shown=[];var i,h='';
  for(i=0;i<COMMANDS.length;i++){if(!q||COMMANDS[i][0].toLowerCase().indexOf(q)>-1)shown.push(COMMANDS[i])}
  if(sel>=shown.length)sel=0;
  for(i=0;i<shown.length;i++){h+='<div class="pi'+(i===sel?' sel':'')+'" data-i="'+i+'"><span>'+shown[i][0]+'</span><small>'+shown[i][1]+'</small></div>'}
  $('pl').innerHTML=h||'<div class="pi"><span class="mu">No matching command</span></div>';
}
function openPal(){$('ov').className='ov on';$('pin').value='';sel=0;paint('');setTimeout(function(){$('pin').focus()},30)}
function closePal(){$('ov').className='ov'}
function run(i){var c=shown[i];if(!c)return;closePal();c[2]()}
function openMod(h){$('mod').innerHTML=h;$('mov').className='ov on'}
function closeMod(){$('mov').className='ov';$('mod').style.maxWidth='';if($('mod').querySelector('.vwb'))$('mod').innerHTML=''}
function modalTask(){
  openMod('<h3>Assign task</h3><div class="stack">'+fld('Task title','mt',tin('mt','What needs to get done'))+fld('Description','mdesc','<textarea id="mdesc" placeholder="What, why, how and what done looks like. Up to 2,000 words."></textarea>')+'<div class="wc" id="mwc">0 / 2000 words</div><div class="frow">'+fld('Assign to','mo',tsel('mo',PEOPLE,'Monish'))+fld('Due','md',tsel('md',dueOpts(),'today'))+'</div><div class="gap" style="justify-content:flex-end"><button class="btn g" data-x="1">Cancel</button><button class="btn" id="ms">Assign task</button></div></div>');
  setTimeout(function(){$('mt').focus()},30);
}

  request:[['title','Request','t'],['detail','Details','a'],['to','Raised to','p'],['priority','Priority','r']],

function modalEdit(id){
  var it=getItem(id);if(!it||!EDITF[it.type])return;var fs=EDITF[it.type],h='',i,f,v,ctl;
  for(i=0;i<fs.length;i++){f=fs[i];v=it[f[0]]||'';
    ctl=f[2]==='a'?'<textarea id="ed_'+f[0]+'">'+esc(v)+'</textarea>':f[2]==='p'?tsel('ed_'+f[0],PEOPLE,v):f[2]==='r'?tsel('ed_'+f[0],['Normal','High','Urgent'],v||'Normal'):'<input id="ed_'+f[0]+'" type="'+(f[2]==='d'?'date':'text')+'" value="'+esc(v)+'">';

function modalMeeting(){

document.addEventListener('click',function(e){
  var t=e.target,n;
  n=t.closest('[data-g]');if(n){var gi=+n.getAttribute('data-g');go(state.last[gi]||GROUPS[gi][2][0]);return}
  n=t.closest('[data-p]');if(n){var p=n.getAttribute('data-p');if(p==='more'){$('sheet').className='sheet on'}else go(p);return}
  n=t.closest('[data-cb]');if(n){state.cb=n.getAttribute('data-cb');render(true);return}
  n=t.closest('[data-tab]');if(n){state.taskTab=n.getAttribute('data-tab');render(true);return}
  n=t.closest('[data-tog]');if(n){var it=getItem(n.getAttribute('data-tog'));if(it){setStatus(it.id,it.status==='COMPLETED'?'PENDING':'COMPLETED');render(true)}return}
  n=t.closest('[data-cyc]');if(n){var it2=getItem(n.getAttribute('data-cyc'));if(it2){var nx={'PENDING':'IN PROGRESS','IN PROGRESS':'COMPLETED','COMPLETED':'PENDING'};setStatus(it2.id,nx[it2.status]||'PENDING');render(true)}return}
  n=t.closest('[data-st]');if(n){var pr=n.getAttribute('data-st').split('|');setStatus(pr[0],pr[1]);render(true);toast('Status set to '+sl(pr[1]));return}
  n=t.closest('[data-rt]');if(n){state.reqTab=n.getAttribute('data-rt');render(true);return}
  n=t.closest('[data-exp]');if(n){var ex=n.getAttribute('data-exp');state.open[ex]=!state.open[ex];render(true);return}
  n=t.closest('[data-vp]');if(n){var vp=n.getAttribute('data-vp').split('|');voice.pitch=+vp[0];voice.fx=vp[1];if(voice.buf)runVoice();else render(true);return}
  n=t.closest('[data-ut]');if(n){state.upTab=n.getAttribute('data-ut');render(true);return}
  n=t.closest('[data-ct]');if(n){state.crTab=n.getAttribute('data-ct');render(true);return}
  n=t.closest('[data-i]');if(n){run(+n.getAttribute('data-i'));return}
  if(t.closest('#goBtn')){state.owner=$('fo_owner').value;state.status=$('fo_status').value;state.when=$('fo_when').value;state.taskTab='pending';go('tasks');return}
  if(t.closest('#clrF')){state.owner='All';state.status='All';state.when='any';render(true);return}
  if(t.closest('#newTask')){modalTask();return}
  if(t.closest('[data-x]')){closeMod();return}
  if(t.closest('#ms')){var v=$('mt').value.trim(),dsc=$('mdesc').value.trim();if(wc(dsc)>2000){toast('Description is over 2,000 words. Please shorten it.');return}if(v){addItem({type:'task',title:v,detail:dsc,from:'Nikhil',to:$('mo').value,due:dueFor($('md').value),status:'PENDING'});closeMod();state.page='tasks';state.taskTab='pending';render();toast('Task assigned')}else{$('mt').focus()}return}
  if(t.closest('#mms')){closeMod();toast('Meeting created');return}
  if(t.closest('#asgBtn')){var at=$('as_t').value.trim();if(!at){$('as_t').focus();return}addItem({type:'task',title:at,from:'Nikhil',to:$('as_o').value,due:dueFor($('as_d').value),status:'PENDING'});render(true);toast('Assigned to '+$('as_o').value);return}
  if(t.closest('#reqBtn')){var rt=$('rq_title').value.trim();if(!rt){$('rq_title').focus();return}addItem({type:'request',title:rt,detail:$('rq_detail').value.trim(),from:$('rq_from').value,to:$('rq_to').value,priority:$('rq_pri').value,status:'RAISED'});state.reqTab='ALL';render(true);toast('Request raised');return}
  if(t.closest('#ctBtn')){var ctt=$('ct_title').value.trim();if(!ctt){$('ct_title').focus();return}addItem({type:'content',title:ctt,from:$('ct_owner').value,to:$('ct_owner').value,priority:$('ct_plat').value,status:'IDEA',due:$('ct_due').value});render(true);toast('Idea added');return}
  if(t.closest('#ldBtn')){var ln=$('ld_name').value.trim();if(!ln){$('ld_name').focus();return}addItem({type:'lead',title:ln,from:$('ld_co').value.trim(),to:$('ld_owner').value,priority:$('ld_val').value.trim()||'0',status:'NEW',notes:$('ld_next').value.trim()});render(true);toast('Lead added');return}
  if(t.closest('#linkBtn')){var lk=$('up_link').value.trim();if(!/^https?:\/\//.test(lk)){toast('Paste a full link starting with https://');return}addItem({type:'upload',title:$('up_note').value.trim()||lk,detail:lk,from:$('up_by').value,to:'Link',priority:'Link',status:'UPLOADED',due:iso(new Date())});render(true);toast('Link added');return}
  if(t.closest('#mlinkBtn')){var ml=$('m_link').value.trim();if(!/^https?:\/\//.test(ml)){toast('Paste a full link starting with https://');return}var mo=modelOpts();addItem({type:'model',title:mo.note||ml,detail:ml,from:mo.by,to:mo.tag,priority:mo.ver+' · Link',status:'TESTING',notes:mo.notes,due:iso(new Date())});render(true);toast('Model added');return}
  if(t.closest('#recBtn')){toggleRec();return}
  if(t.closest('#vApply')){voice.pitch=+$('vPitch').value;voice.fx=$('vFx').value;runVoice();return}
  if(t.closest('#vSave')){if(!voice.blob)return;var nm='voice-'+voice.pitch+'st-'+voice.fx+'.wav';sendFiles([new File([voice.blob],nm,{type:'audio/wav'})],{by:$('v_by').value,note:'Voice: '+voice.name+' ('+voice.fx+', '+voice.pitch+' st)',noRender:true});return}
  if(t.closest('#kBtn')){openPal();return}
  n=t.closest('[data-open],[data-dl]');if(n){var dlf=n.hasAttribute('data-dl'),ok=n.getAttribute(dlf?'data-dl':'data-open'),cd=n.closest('[data-id]'),oi=cd?getItem(cd.getAttribute('data-id')):null;openFile(ok,oi||{title:'File',to:'',notes:''},dlf);return}
  if(t.closest('#cnBtn')){modalConnect();return}
  if(t.closest('#cnTest')){var tu=$('cn_url').value.trim(),rs=$('cnRes');if(!tu){rs.className='cnres bad';rs.textContent='Paste the URL first.';return}
    var keep=CFG.SCRIPT_URL;CFG.SCRIPT_URL=tu;rs.className='cnres';rs.textContent='Testing...';
    GoogleSheets.ping().then(function(n){CFG.SCRIPT_URL=keep;rs.className='cnres ok';rs.textContent='Connected. The sheet returned '+n+' record'+(n===1?'':'s')+'.'}).catch(function(err){CFG.SCRIPT_URL=keep;rs.className='cnres bad';rs.textContent='Failed: '+errMsg(err)+'.'});return}
  n=t.closest('[data-edit]');if(n){modalEdit(n.getAttribute('data-edit'));return}
  n=t.closest('[data-del]');if(n){var di=n.getAttribute('data-del'),dt=getItem(di);if(dt&&window.confirm('Delete "'+(dt.title||'this record')+'"? This also removes it from the Google sheet.')){deleteItem(di);toast('Deleted');render(true)}return}
  if(t.closest('#edSave')){var box=t.closest('[data-eid]'),eid=box.getAttribute('data-eid'),eit=getItem(eid),ef=EDITF[eit.type],fv={},q;
    for(q=0;q<ef.length;q++){fv[ef[q][0]]=$('ed_'+ef[q][0]).value.trim()}
    if(!fv.title){toast('Title cannot be empty');return}
    if(eit.type==='task'&&fv.detail&&fv.detail.split(/\s+/).length>2000){toast('Description is over 2,000 words');return}
    editItem(eid,fv);closeMod();toast('Saved');render(true);return}
  if(t.closest('#cnSave')){var cu=$('cn_url').value.trim();if(cu&&!/^https:\/\/script\.google\.com\/macros\/s\/[-\w]+\/exec$/.test(cu)){toast('That does not look like a Web app URL ending in /exec');return}try{if(cu)localStorage.setItem('nts_script',cu);else localStorage.removeItem('nts_script')}catch(err){}CFG.SCRIPT_URL=cu;ig.data=null;closeMod();toast(cu?'Connected. Syncing...':'Disconnected, using this device only');lastWrite=0;loadItems(function(){render(true)});render(true);return}
  if(t.closest('#igRef')){igRefresh();return}
  if(t.closest('#nBtn')){toast(openCount()+' open requests, '+pendCount()+' pending tasks');return}
  if(t.closest('#fvBtn')){state.founder=!state.founder;state.page='command';render();return}
  if(t.closest('#thBtn')){var cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',cur);try{localStorage.setItem('nts_theme',cur)}catch(err){}themeIcon();if(state.page==='voice')render(true);return}
  if(t===$('ov'))closePal();if(t===$('mov'))closeMod();
  if(!t.closest('#sheet'))$('sheet').className='sheet';
});
function themeIcon(){var l=document.documentElement.getAttribute('data-theme')==='light';$('thIco').className='ph '+(l?'ph-sun':'ph-moon')}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}
  if(e.key==='Escape'){closePal();closeMod();return}
  if($('ov').className.indexOf('on')>-1){
    if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%Math.max(shown.length,1);paint($('pin').value)}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+shown.length)%Math.max(shown.length,1);paint($('pin').value)}
    else if(e.key==='Enter'){run(sel)}
  }
});
document.addEventListener('change',function(e){var t=e.target;if(!t)return;
  if(t.id==='fileIn'){sendFiles(t.files);t.value=''}
  else if(t.id==='mFile'){sendFiles(t.files,modelOpts());t.value=''}
  else if(t.id==='vFile'){if(t.files[0]){decodeBlob(t.files[0],t.files[0].name)}t.value=''}
  else if(t.id==='vFx'){voice.fx=t.value}
  else if(t.getAttribute&&t.getAttribute('data-mv')){setStatus(t.getAttribute('data-mv'),t.value);render(true);toast('Moved to '+sl(t.value))}});
document.addEventListener('input',function(e){var t=e.target;if(!t)return;
  if(t.id==='mdesc'){var n=wc(t.value),w=$('mwc');w.textContent=n+' / 2000 words';w.className='wc'+(n>2000?' bad':'')}
  else if(t.id==='vPitch'){voice.pitch=+t.value;var lb=document.querySelector('label[for="vPitch"]');if(lb)lb.textContent='Pitch, '+stLabel(voice.pitch)}});
document.addEventListener('dragover',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('hot')}});
document.addEventListener('dragleave',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('hot')});
document.addEventListener('drop',function(e){var d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.remove('hot');sendFiles(e.dataTransfer.files,dropOpts(d))}});
$('pin').addEventListener('input',function(){sel=0;paint(this.value)});

/* ---------- depth and interaction ---------- */
(function(){
  var coin=$('coin'),glow=$('glow'),cv=$('fx'),cx=cv.getContext&&cv.getContext('2d'),mx=0,my=0,tx=0,ty=0,W=0,H=0,pts=[],raf=0,i;
  function tilt(el,e,max){var r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    el.style.transform='perspective(900px) rotateX('+((.5-py)*max*2).toFixed(2)+'deg) rotateY('+((px-.5)*max*2).toFixed(2)+'deg) translateZ(0)';
    el.style.setProperty('--mx',(px*100)+'%');el.style.setProperty('--my',(py*100)+'%')}
  document.addEventListener('mousemove',function(e){
    tx=(e.clientX/window.innerWidth-.5);ty=(e.clientY/window.innerHeight-.5);
    glow.style.opacity=1;glow.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
    if(RM)return;
    var t=e.target,c=t.closest&&t.closest('.card');
    if(c&&!c.querySelector('input,textarea,select')&&!c.classList.contains('flat')){tilt(c,e,3)}
    else if(c){var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}
    if(coin){var r2=coin.getBoundingClientRect(),dx=(e.clientX-(r2.left+r2.width/2))/Math.max(window.innerWidth,1),dy=(e.clientY-(r2.top+r2.height/2))/Math.max(window.innerHeight,1);
      coin.style.transform='perspective(700px) rotateY('+Math.max(-14,Math.min(14,dx*28)).toFixed(1)+'deg) rotateX('+Math.max(-12,Math.min(12,-dy*24)).toFixed(1)+'deg)'}
  });
  document.addEventListener('mouseout',function(e){var c=e.target.closest&&e.target.closest('.card');if(c&&(!e.relatedTarget||!c.contains(e.relatedTarget)))c.style.transform=''});
  document.addEventListener('click',function(e){
    var w=e.target.closest&&e.target.closest('[data-who]');
    if(w){state.owner=w.getAttribute('data-who');state.taskTab='pending';state.status='All';state.when='any';go('tasks');return}
    var m=e.target.closest&&e.target.closest('#sMore');
    if(m){var o=$('side').className.indexOf('open')>-1;$('side').className=o?'side':'side open';m.setAttribute('aria-expanded',o?'false':'true')}
  });
  /* depth field: points at different z, parallax with the pointer */
  function size(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
  function seed(){pts=[];var n=Math.round(Math.min(90,W*H/22000));for(i=0;i<n;i++){pts.push({x:Math.random()*W,y:Math.random()*H,z:.2+Math.random()*.8,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})}}
  function col(){return getComputedStyle(document.documentElement).getPropertyValue('--act').trim()||'#7aa8ff'}
  function draw(){
    var c=col(),a,b,d,j,px,py,qx,qy;cx.clearRect(0,0,W,H);mx+=(tx-mx)*.05;my+=(ty-my)*.05;cx.fillStyle=c;cx.strokeStyle=c;
    for(i=0;i<pts.length;i++){a=pts[i];if(!RM){a.x+=a.vx*a.z;a.y+=a.vy*a.z;if(a.x<-20)a.x=W+20;if(a.x>W+20)a.x=-20;if(a.y<-20)a.y=H+20;if(a.y>H+20)a.y=-20}
      a._x=a.x-mx*80*a.z;a._y=a.y-my*80*a.z;cx.globalAlpha=.15+a.z*.4;cx.beginPath();cx.arc(a._x,a._y,.6+a.z*1.8,0,6.283);cx.fill()}
    for(i=0;i<pts.length;i++){for(j=i+1;j<pts.length;j++){a=pts[i];b=pts[j];px=a._x-b._x;py=a._y-b._y;d=px*px+py*py;
      if(d<14000){cx.globalAlpha=(1-d/14000)*.18*Math.min(a.z,b.z);cx.lineWidth=.7;cx.beginPath();cx.moveTo(a._x,a._y);cx.lineTo(b._x,b._y);cx.stroke()}}}
    if(!RM&&!document.hidden)raf=requestAnimationFrame(draw)
  }
  if(cx){size();seed();draw();window.addEventListener('resize',function(){size();seed();if(RM)draw()});
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&!RM){cancelAnimationFrame(raf);draw()}})}
})();

  if((m=raw.match(/^\s*(?:please\s+)?(?:mark\s+)?(?:complete|completed|finish|finished|done)\s+(?:task\s+)?(.{2,120})$/i))||(m=raw.match(/^\s*mark\s+(.{2,120}?)\s+(?:as\s+)?(?:done|complete|completed)$/i))){var t=njFind(m[1]);if(t){setStatus(t.id,'COMPLETED');render(true);return 'Marked as completed: "'+t.title+'". Nice work!'}return 'I could not find a pending task matching "'+m[1]+'". Say "pending tasks" to see the list.'}
  /* theme */
  if(/\b(dark|light)\s*(mode|theme)\b|\b(switch|toggle|change)\s+(the\s+)?(theme|mode)\b/.test(q)){var cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark',want=/\bdark\b/.test(q)?'dark':/\blight\b/.test(q)?'light':(cur==='dark'?'light':'dark');if(want!==cur)$('thBtn').click();return 'Switched to '+want+' theme. My costume changes with it.'}
  /* navigation */
  if((m=q.match(/^(?:please\s+)?(?:open|go to|goto|show|take me to|navigate to|visit)\s+(?:the\s+|me\s+the\s+)?(.+?)(?:\s+page|\s+section|\s+tab)?$/))){var pk;for(pk in NJPG){if(NJPG[pk].test(m[1])&&(pk!=='content'||!/\bpending|open\b/.test(m[1]))){go(pk);return 'Opening '+PAGES[pk][0]+'.'}}}
  /* data */
  if(/\b(pending|open|due|outstanding|todo|to-do)\b.*\btasks?\b|\btasks?\b.*\b(pending|left|due)\b|what('?s| is) pending|my tasks|today'?s? (work|tasks?)/.test(q)){var who=njWho(q);var p=[],all=T();for(i=0;i<all.length;i++){if(all[i].status!=='COMPLETED'&&(!who||all[i].to===who))p.push(all[i])}
    return p.length?(who?who+' has ':'')+p.length+' pending task'+(p.length===1?'':'s')+':\n'+njList(p,function(x){return x.title+(x.to?' ('+x.to+')':'')+(x.due?', due '+x.due:'')}):'No pending tasks'+(who?' for '+who:'')+'. All clear!'}
  if(/\b(completed|done|finished)\s+tasks?|tasks?\s+(completed|done)\b/.test(q)){var dn=cnt(T(),function(x){return x.status==='COMPLETED'});return dn+' task'+(dn===1?'':'s')+' completed so far.'}
  if(/\brequests?\b/.test(q)&&/\b(how many|open|pending|status|list|show|what)\b/.test(q)){var rq=R(),op=[];for(i=0;i<rq.length;i++){if(rq[i].status!=='COMPLETED')op.push(rq[i])}return op.length?op.length+' open request'+(op.length===1?'':'s')+':\n'+njList(op,function(x){return x.title+' ['+x.status+']'}):'No open requests right now.'}
  if(/\b(videos?|content|published|100)\b/.test(q)&&/\b(how many|progress|done|published|left|target|status)\b/.test(q)){var pb=cnt(byType('content'),function(c){return c.status==='PUBLISHED'});return pb+' of 100 videos published. Target: 100 videos by 30 November 2026, so '+(100-pb)+' to go.'}
  if(/\b(uploads?|files?)\b/.test(q)&&/\b(how many|count|list)\b/.test(q)){return byType('upload').length+' upload'+(byType('upload').length===1?'':'s')+' saved on this device.'}
  if(/\b(summary|status|update|overview|how are we doing|how is (the )?studio)\b/.test(q)){return njPage()+'.'}
  /* knowledge */
  if(/\b(who are you|your name|what are you)\b/.test(q))return 'I am Dal_Abba, the AI Ninja of NIKHILs TECH STUDIO. I know the studio, its tasks and requests, and I remember things you tell me.';
  if(/\b(team|who works|members|people)\b/.test(q)){return 'The team:\n'+njList(KB.team,function(x){return x.name+', '+x.role})}
  if(/\bnikhil\b/.test(q)&&/\b(who|role)\b/.test(q))return 'Nikhil is the Founder and Strategic Head. He assigns the daily work.';
  if(/\bmonish\b/.test(q)&&/\b(who|role)\b/.test(q))return 'Monish is the Creative Head, leading creative and content production.';
  if(/\bpranav\b/.test(q)&&/\b(who|role)\b/.test(q))return 'Pranav is the Operations and Marketing Lead.';
  if(/\b(tell me about|about|what is|what does)\b.*\b(studio|nikhils|company)\b|^studio$/.test(q))return 'NIKHILs TECH STUDIO is a three-person team: '+KB.tagline+' We run an AI-focused studio, and we are working towards 100 videos by 30 November 2026. This OS tracks daily tasks, requests, uploads and content.';
  if(/\b(contact|reach|email|phone|whatsapp)\b/.test(q))return KB.contact+'. For now, reach the team through Instagram.';
  if(/\b(sell|selling|revenue|monetis|monetiz|income|earn)\b/.test(q))return 'Selling and monetisation have not started yet, and there is no revenue so far. The Monetization page is ready for when that begins.';
  if(/\b(services?|build|offer|capabilit|what can you do)\b/.test(q)&&!/\bwhat can you do\b/.test(q))return KB.services+'. Ask Nikhil for the latest.';
  if(/\b(goal|target|mission|philosophy|motto|tagline)\b/.test(q))return 'Our line: '+KB.philosophy+' Current goal: publish 100 videos by 30 November 2026.';
  if(/\b(instagram|insta)\b/.test(q))return 'The studio is on Instagram. Daily sync is paused for now, but you can upload posts on the Uploads page.';
  if(/\b(time|what time)\b/.test(q)&&!/\bdue\b/.test(q))return 'It is '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'.';
  if(/\b(date|today'?s date|what day)\b/.test(q))return 'Today is '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
  /* Dal_Abba moods */
  if(/\b(coffee|chai|tea)\b/.test(q)){NJ.act={st:'COFFEE',hold:9000,sfx:['ding','sip']};return 'Here you go'+(nm?', '+nm:'')+', one hot cup! Careful, it is steaming. Dal_Abba makes the best chai in the studio.'}
  if(/\b(sing|song|gaana|gana)\b/.test(q)){NJ.act={st:'SINGING',hold:6500,sfx:['sing']};return 'La la laaa... Dal_Abba is on stage!'}
  if(/\b(dance|naach|party)\b/.test(q)){NJ.act={st:'DANCING',hold:6000,sfx:['whistle']};return 'Dance mode on! Watch these moves.'}
  if(/\b(yawn|bored|stretch)\b/.test(q)){NJ.act={st:'YAWNING',hold:2600,sfx:['yawn']};return 'Haaaaah... sorry, long day of guarding the studio.'}
  if(/\b(wake up|wake)\b/.test(q)){NJ.sleepLock=false;NJ.act={st:'EXCITED',hold:1500,sfx:['wake']};return 'I am up, I am up! What is the plan?'}
  if(/\b(sleep|nap|go to bed|sone)\b/.test(q)){NJ.sleepLock=true;NJ.act={st:'SLEEPING',hold:0,sfx:['snore']};return 'Zzz... wake me by clicking on me.'}
  if(/\b(laugh|haha|lol|hehe)\b/.test(q)){NJ.act={st:'LAUGHING',hold:3200,sfx:['laugh']};return 'Hahaha! Okay, that was funny.'}
  if(/\b(boing|toing|sound|noise|squeak|make me laugh)\b/.test(q)){var pk=POKES[Math.floor(Math.random()*POKES.length)];NJ.act={st:pk[1],hold:1800,sfx:[pk[0]]};return 'Boing! Sound effects are on when the bell button in my header is lit. Click me anytime.'}
  if(/\b(dal ?abba)\b/.test(q)&&!/\b(who|what)\b/.test(q)){NJ.act={st:'EXCITED',hold:1200,sfx:['squeak']};return 'Yes? Dal_Abba here! Ask me anything.'}
  /* small talk */
  if(/^(hi|hello|hey|namaste|yo|hii+|good (morning|afternoon|evening))\b/.test(q))return 'Hey'+(nm?' '+nm:'')+'! What shall we do? I can show pending tasks, assign work, or open any page.';
  if(/\bhow are you\b/.test(q))return 'Sharp and ready'+(nm?', '+nm:'')+'! '+pendCount()+' task'+(pendCount()===1?'':'s')+' pending. Want to see them?';
  if(/\b(thanks|thank you|thx|great|awesome|nice|cool)\b/.test(q))return 'Anytime'+(nm?', '+nm:'')+'!';
  if(/\b(bye|goodbye|see you|good night)\b/.test(q))return 'See you soon'+(nm?', '+nm:'')+'. I will remember everything.';
  if(/\b(joke)\b/.test(q)){NJ.act={st:'LAUGHING',hold:3200,sfx:['laugh']};return 'Why did the ninja bring a laptop? To stay in stealth mode and still ship on time. Ha ha!'}
  if(/\b(help|commands?|what can you do|how do i use)\b/.test(q))return 'I can:\n- Show pending tasks, open requests, video progress\n- Assign work: "Assign edit reel to Monish tomorrow"\n- Raise a request: "Raise request: new camera"\n- Complete a task: "Done edit reel"\n- Open pages: "Open uploads"\n- Switch theme: "Dark mode"\n- Fun: "Chai?", "Sing", "Dance", "Yawn", "Go to sleep", "Boing"\n- Remember you: "My name is ...", "Remember that ..."';
  return null;
}
function njSuggest(){
  var l=['What is pending today?','How many videos are done?','Open requests','Who is on the team?','What can you do?'],h='',i;
  for(i=0;i<l.length;i++){h+='<button data-nsg="'+i+'">'+esc(l[i])+'</button>'}
  $('njSug').innerHTML=h;$('njSug').style.display='flex';$('njSug').setAttribute('data-l',JSON.stringify(l));
}
function njGreet(){
  $('njMsgs').innerHTML='';var nm=NJM.name,back=NJM.hist.length&&NJM.visits>0,i,h=NJM.hist.slice(-8);
  if(back){for(i=0;i<h.length;i++)njAdd(h[i].r==='u'?'user':'assistant',h[i].t);njAdd('assistant','Welcome back'+(nm?', '+nm:'')+'! I remember our last chat. '+pendCount()+' task'+(pendCount()===1?'':'s')+' pending right now.')}
  else njAdd('assistant','Hey'+(nm?' '+nm:'')+'! I am Dal_Abba, the NIKHILs TECH STUDIO assistant. I can check tasks, assign work, open pages, and I remember what you tell me. Say "help" to see everything, or tell me your name.');
  NJM.visits++;njmSave();njSuggest();
}
function njPage(){var n=PAGES[state.page]?PAGES[state.page][0]:state.page;return n+' (live: '+pendCount()+' pending tasks, '+openCount()+' open requests, '+cnt(byType('content'),function(c){return c.status==='PUBLISHED'})+' videos published of 100)'}
function njOpen(){
  if(NJ.open)return;NJ.open=true;njRoot.className=njRoot.className.replace(/\bopen\b/,'')+' open';
  $('njLogo').src=$('logoImg').src;$('njDot').className='on';njStat();
  if(!$('njMsgs').children.length)njGreet();
  njState('LISTENING');setTimeout(function(){if(NJ.st==='LISTENING'&&!NJ.busy)njState('HAPPY',1600)},500);
  setTimeout(function(){$('njIn').focus()},350);njState(NJ.st);
}
function njStat(){var e=$('njSt');if(!e)return;e.textContent=(NLAB[NJ.st]||(NJ.llm&&NJ.llm.ready?'ON-DEVICE AI':'LOCAL BRAIN'))||(NJ.llm&&NJ.llm.ready?'ON-DEVICE AI':'LOCAL BRAIN, REMEMBERS YOU')}
function njClose(){
  if(!NJ.open)return;njStopAll();NJ.open=false;njRoot.className=njRoot.className.replace(/\s*\bopen\b/,'');
  njState('GOODBYE',1700);$('njStage').focus();
}
function njStopAll(){
  if(NJ.abort){try{NJ.abort.abort()}catch(err){}}NJ.abort=null;if(NJ.rev){clearInterval(NJ.rev);NJ.rev=null}
  try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(err){}
  if(NJ.rec){try{NJ.rec.stop()}catch(err){}}
  NJ.busy=false;NJ.speaking=false;njTyping(false);njGoUi();
}
function njGoUi(){var b=$('njGo');b.innerHTML='<i class="ph ph-'+(NJ.busy?'stop':'paper-plane-tilt')+'" aria-hidden="true"></i>';b.setAttribute('aria-label',NJ.busy?'Stop response':'Send message');b.title=NJ.busy?'Stop':'Send'}
function njErr(t){NJ.got=true;njTyping(false);NJ.busy=false;njGoUi();njAdd('assistant',t,'e');njState('ERROR',3200)}
function njSend(text){
  text=(text||'').replace(/^\s+|\s+$/g,'');if(!text||NJ.busy)return;
  $('njSug').style.display='none';njAdd('user',text);$('njIn').value='';$('njIn').style.height='';
  NJ.hist.push({role:'user',text:text});if(NJ.hist.length>24)NJ.hist.shift();njmPush('user',text);
  NJ.sleepLock=false;sfx('send');NJ.busy=true;NJ.got=false;njGoUi();njState('LISTENING');
  var rep=null;try{rep=njLocal(text)}catch(err){rep=null}
  if(rep!==null){setTimeout(function(){if(NJ.busy)njAnswer(rep,text)},380);return}
  if(NJ.llm&&NJ.llm.ready){njLLM(text);return}
  setTimeout(function(){if(!NJ.busy)return;var f='I do not have an answer for that yet. I am running on my local brain, so I am best at studio questions. Try "help", or ask about tasks, requests, videos, or the team.';
    if(!NJ.llm||!NJ.llm.tried)f+='\n\nWant me to answer anything? Tap "Enable smarter AI" below. It downloads a small model once and then runs on your device, free.';
    njAnswer(f,text);njLlmChip()},420);
}
/* optional on-device LLM (free, no server): WebLLM via WebGPU */
NJ.llm={ready:false,tried:false,eng:null,loading:false};
function njLlmChip(){
  if($('njLlm')||NJ.llm.ready)return;var b=document.createElement('button');b.id='njLlm';b.className='nj-llm';b.textContent='Enable smarter AI (about 400 MB, once)';
  b.onclick=njEnableLLM;$('njSug').parentNode.insertBefore(b,$('njSug'));
}
function njEnableLLM(){
  var b=$('njLlm');if(NJ.llm.loading)return;NJ.llm.tried=true;
  if(!navigator.gpu){if(b)b.textContent='This browser has no WebGPU. Use Chrome or Edge on desktop.';njAdd('assistant','The on-device AI needs WebGPU, which this browser does not offer. I will keep using my local brain. Chrome or Edge on a laptop usually works.','e');return}
  NJ.llm.loading=true;if(b)b.textContent='Loading AI... 0%';njAdd('assistant','Downloading the on-device AI. It happens once, then it is cached in your browser.');
  var imp=new Function('u','return import(u)');
  imp('https://esm.run/@mlc-ai/web-llm').then(function(w){
    return w.CreateMLCEngine('Qwen2.5-0.5B-Instruct-q4f16_1-MLC',{initProgressCallback:function(p){var pc=Math.round((p.progress||0)*100);var bb=$('njLlm');if(bb)bb.textContent='Loading AI... '+pc+'%'}});
  }).then(function(e){NJ.llm.eng=e;NJ.llm.ready=true;NJ.llm.loading=false;var bb=$('njLlm');if(bb)bb.parentNode.removeChild(bb);njStat();njAdd('assistant','On-device AI is ready. Ask me anything now.');njState('HAPPY',1600)})
  .catch(function(){NJ.llm.loading=false;var bb=$('njLlm');if(bb)bb.textContent='Could not load. Tap to retry';njAdd('assistant','I could not download the on-device AI. Check your internet and try again. My local brain still works.','e')});
}
function njLLM(text){
  njState('THINKING');njTyping(true);
  var sys='You are Dal_Abba, the playful AI Ninja assistant of NIKHILs TECH STUDIO, a three-person studio (Nikhil founder, Monish creative head, Pranav operations and marketing). Answer briefly and kindly. Studio facts: '+JSON.stringify(KB)+'. Live state: '+njPage()+'.'+(NJM.name?' The user is '+NJM.name+'.':'')+(NJM.notes.length?' Things the user asked you to remember: '+NJM.notes.join('; ')+'.':'');
  var msgs=[{role:'system',content:sys}],h=NJ.hist.slice(-8),i;for(i=0;i<h.length;i++)msgs.push({role:h[i].role==='user'?'user':'assistant',content:h[i].text});
  NJ.llm.eng.chat.completions.create({messages:msgs,max_tokens:300,temperature:.6}).then(function(r){
    var t=r&&r.choices&&r.choices[0]&&r.choices[0].message?r.choices[0].message.content:'';
    if(!NJ.busy)return;if(t)njAnswer(t,text);else njAnswer('I could not think of an answer. Try asking differently.',text);
  }).catch(function(){if(NJ.busy)njErr('The on-device AI hit a problem. Try again.')});
}
function njAnswer(text,q){
  NJ.got=true;njTyping(false);NJ.hist.push({role:'assistant',text:text});njmPush('assistant',text);sfx('blip');
  var b=njAdd('assistant',''),i=0,n=text.length,step=Math.max(2,Math.round(n/90));
  njState('TALKING');
  if(NJ.voice||NJ.voiceOnce)njSpeak(text);
  NJ.voiceOnce=false;
  NJ.rev=setInterval(function(){
    i=Math.min(n,i+step);b.textContent=text.substring(0,i);$('njMsgs').scrollTop=1e6;
    if(i>=n){clearInterval(NJ.rev);NJ.rev=null;NJ.busy=false;njGoUi();
      var m=njMood(q,text);
      var act=NJ.act;NJ.act=null;
      var finish=function(){if(NJ.speaking){setTimeout(finish,300);return}
        if(act){njState(act.st,act.hold);var si;for(si=0;si<act.sfx.length;si++){(function(n,d){setTimeout(function(){sfx(n)},d)})(act.sfx[si],si*1300)}}else njState(m,m==='IDLE'?0:1800)};finish()}
  },30);
}
function njMood(q,a){
  if(/\b(thanks|thank you|great|awesome|nice|cool|love)\b/i.test(q)||/^(hi|hey|hello)\b/i.test(q))return 'HAPPY';
  if(/\b(bye|goodbye|see you)\b/i.test(q))return 'GOODBYE';
  if(/\b(not sure|do not have|don't have|no idea|unclear|could you clarify|not been added)\b/i.test(a))return 'CONFUSED';
  if(/!\s*$/.test(a.replace(/\s+$/,'')))return 'HAPPY';
  return 'IDLE';
}
/* voice out */
function njVoice(){
  var v=window.speechSynthesis?window.speechSynthesis.getVoices():[],i,best=null,sc=-1;
  for(i=0;i<v.length;i++){var n=(v[i].name+' '+v[i].lang).toLowerCase(),s=0;
    if(/en[-_]in/.test(n))s+=5;if(/en[-_](gb|us|au)/.test(n))s+=1;if(/male|ravi|prabhat|rishi|hemant|google uk english male|daniel|david|james|aaron/.test(n))s+=3;if(/female|heera|zira|samantha|kalpana|natural/.test(n)&&!/male/.test(n.replace('female','')))s-=1;
    if(s>sc){sc=s;best=v[i]}}
  return best;
}
function njSpeak(text){
  if(!window.speechSynthesis)return;
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text.replace(/[*_`#]/g,'')),v=njVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-IN';u.rate=.93;u.pitch=.8;
    u.onstart=function(){NJ.speaking=true;njState('TALKING')};u.onend=u.onerror=function(){NJ.speaking=false};
    window.speechSynthesis.speak(u)}catch(err){}
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=function(){}}
/* voice in */
function njMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Voice input is not supported in this browser. You can still type.');return}
  if(NJ.rec){try{NJ.rec.stop()}catch(err){}return}
  var r=new SR(),fin='';r.lang='en-IN';r.interimResults=true;r.continuous=false;NJ.rec=r;
  $('njMic').className='nj-ib rec';njState('LISTENING');
  r.onresult=function(e){var s='',i;for(i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=s}$('njIn').value=s};
  r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')njAdd('assistant','Microphone access isn\'t available. You can still chat with me using text.','e')};
  r.onend=function(){NJ.rec=null;$('njMic').className='nj-ib';var t=$('njIn').value;if(t&&!NJ.busy){NJ.voiceOnce=true;njSend(t)}else if(!NJ.busy)njState('IDLE')};
  try{r.start()}catch(err){NJ.rec=null;$('njMic').className='nj-ib'}
}

/* ---------- wiring ---------- */
function njAttention(){njPoke();setTimeout(function(){njOpen()},700)}
$('njStage').addEventListener('click',function(){if(NJ.open){njPoke()}else{njAttention()}});
$('njStage').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();NJ.open?njPoke():njAttention()}});
$('njFlat').addEventListener('click',function(){NJ.open?njClose():njOpen()});
$('njX').addEventListener('click',njClose);
$('njClr').addEventListener('click',function(){njStopAll();NJ.hist=[];NJM.hist=[];njmSave();njGreet();njState('IDLE')});
$('njSpk').addEventListener('click',function(){NJ.voice=!NJ.voice;this.setAttribute('aria-pressed',NJ.voice?'true':'false');this.className='nj-ib'+(NJ.voice?' on':'');this.setAttribute('aria-label',NJ.voice?'Turn voice replies off':'Turn voice replies on');$('njSpkI').className='ph ph-speaker-'+(NJ.voice?'high':'slash');if(!NJ.voice){try{window.speechSynthesis.cancel()}catch(err){}NJ.speaking=false}});
$('njSfx').addEventListener('click',function(){SFX.on=!SFX.on;try{localStorage.setItem('nts_sfx',SFX.on?'1':'0')}catch(err){}this.className='nj-ib '+(SFX.on?'on':'off');this.setAttribute('aria-pressed',SFX.on?'true':'false');if(SFX.on)sfx('boing')});
$('njMic').addEventListener('click',njMic);
$('njGo').addEventListener('click',function(){if(NJ.busy){njStopAll();njState('IDLE');return}njSend($('njIn').value)});
$('njIn').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();njSend(this.value)}if(e.key==='Escape')njClose()});
$('njIn').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(110,this.scrollHeight)+'px'});
$('njSug').addEventListener('click',function(e){var b=e.target.closest('[data-nsg]');if(!b)return;var l=JSON.parse(this.getAttribute('data-l'));njSend(l[+b.getAttribute('data-nsg')])});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&NJ.open&&$('mov').className.indexOf('on')<0)njClose()});
document.addEventListener('mousedown',function(e){if(NJ.open&&window.innerWidth<=820&&!e.target.closest('#nj'))njClose()});
window.addEventListener('nts-logo',njSetLogo);

poll();setInterval(poll,45000);
})();
